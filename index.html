<!DOCTYPE html>
<html>
<head>
    <title>张的秘密</title>
    <meta charset="utf-8">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Microsoft YaHei";
        }

        body{
            height:100vh;
            background:
            linear-gradient(
            rgba(0,0,0,0.6),
            rgba(0,0,0,0.8)
            ),
            url("https://picsum.photos/1920/1080");
            background-size:cover;
            background-position:center;
            color:white;
        }


        .container{
            width:80%;
            margin:auto;
            padding-top:80px;
            text-align:center;
        }


        h1{
            font-size:50px;
            letter-spacing:8px;
            color:#fff;
            text-shadow:
            0 0 10px #00ffff,
            0 0 20px #00ffff;
        }


        .subtitle{
            margin-top:20px;
            font-size:20px;
            color:#ddd;
        }


        .card{
            margin:50px auto;
            width:600px;
            padding:30px;
            background:
            rgba(255,255,255,0.1);
            border-radius:20px;
            backdrop-filter:blur(10px);
            box-shadow:
            0 0 30px rgba(0,255,255,0.3);
        }


        .card h2{
            margin-bottom:20px;
            color:#00ffff;
        }


        .secret{
            line-height:2;
            font-size:18px;
        }


        button{
            margin-top:30px;
            padding:12px 35px;
            border:none;
            border-radius:30px;
            background:#00ffff;
            color:#111;
            font-size:18px;
            cursor:pointer;
        }


        button:hover{
            background:white;
            transform:scale(1.05);
        }


        footer{
            margin-top:50px;
            color:#aaa;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>张的秘密</h1>

    <p class="subtitle">
        一个只属于自己的神秘空间
    </p>


    <div class="card">

        <h2>🌙 关于我</h2>

        <p class="secret">
            欢迎来到张的秘密世界。<br>
            这里记录我的想法、故事和珍贵回忆。<br>
            每一个秘密，都值得被珍藏。
        </p>


        <button>
            打开秘密
        </button>

    </div>


    <footer>
        © 2026 张的秘密 · My Secret World
    </footer>


</div>


</body>
</html>
