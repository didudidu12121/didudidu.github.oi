<!DOCTYPE html>
<html>

<head>
    <title>张的秘密</title>
    <meta charset="utf-8">

    <style>

        body{
            margin:0;
            padding:0;
            background:#f5f5f5;
            font-family:"Microsoft YaHei";
            color:#333;
        }


        .box{
            width:700px;
            margin:80px auto;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
            text-align:center;
        }


        h1{
            font-size:40px;
            font-weight:normal;
            margin-bottom:15px;
        }


        .intro{
            color:#777;
            font-size:18px;
        }


        .line{
            width:80px;
            height:3px;
            background:#333;
            margin:25px auto;
        }


        .content{
            text-align:left;
            line-height:2;
            font-size:16px;
        }


        .card{
            margin-top:30px;
            padding:20px;
            background:#fafafa;
            border-radius:10px;
        }


        button{
            margin-top:25px;
            padding:10px 30px;
            border:none;
            border-radius:20px;
            background:#333;
            color:white;
            cursor:pointer;
        }


        button:hover{
            background:#555;
        }


        footer{
            margin-top:40px;
            font-size:14px;
            color:#999;
        }


    </style>

</head>


<body>


<div class="box">

    <h1>张的秘密</h1>

    <p class="intro">
        记录一些属于我的故事
    </p>


    <div class="line"></div>


    <div class="content">

        <div class="card">
            <h3>关于这里</h3>

            <p>
                这是我的个人小空间。<br>
                这里会放一些想法、照片，
                还有值得记录的事情。
            </p>

        </div>


        <div class="card">

            <h3>最近</h3>

            <p>
                今天也在努力生活。<br>
                慢慢积累，慢慢成长。
            </p>

        </div>


    </div>


    <button>
        查看更多
    </button>


    <footer>
        © 2026 张的秘密
    </footer>


</div>


</body>

</html>
